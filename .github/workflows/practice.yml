name: Practice checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run practice checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3
          for file in practice/*.php tests/*.php demo.php; do php -l "$file"; done
          php tests/run.php
